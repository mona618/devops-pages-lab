<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Mona's DevOps activity log, validated and deployed by GitHub Actions.">
  <title>{{ page.title }} · Mona's DevOps Activity Lab</title>
  <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <div class="shell header-row">
      <a class="brand" href="{{ '/' | relative_url }}">Mona's DevOps Activity Lab</a>
      <a class="header-link" href="https://github.com/mona618/devops-pages-lab">View source ↗</a>
    </div>
  </header>
  <main class="shell content" id="main-content">
    {{ content }}
  </main>
  <footer class="site-footer">
    <div class="shell">GitHub activity → README → Jekyll → GitHub Pages · Updated by GitHub Actions</div>
  </footer>
</body>
</html>
